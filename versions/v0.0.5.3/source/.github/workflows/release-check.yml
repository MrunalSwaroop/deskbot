name: Deskbot release check

on:
  push:
    branches: [main]
    paths:
      - 'boards/**'
      - 'firmware/**'
      - 'modules/**'
      - 'hardware/**'
      - 'fleet/**'
      - 'tools/**'
      - 'VERSION'
      - 'CHANGE_SUMMARY.md'
      - '.github/workflows/release-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'boards/**'
      - 'firmware/**'
      - 'modules/**'
      - 'hardware/**'
      - 'fleet/**'
      - 'tools/**'
      - 'VERSION'
      - 'CHANGE_SUMMARY.md'
      - '.github/workflows/release-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Deskbot repository contract
        run: python3 tools/check_release.py
